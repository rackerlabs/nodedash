---
name: ci

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Runs against the mock backend (VITE_MOCK), so it needs no live region.
      - run: npm run test:e2e

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: helm lint charts/nodedash -f charts/nodedash/ci/test-values.yaml
      - run: helm template ci charts/nodedash -f charts/nodedash/ci/test-values.yaml > /dev/null

  image:
    needs: [test, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Push to GHCR and attach build provenance, only off main or a release tag.
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      # GHCR names must be lowercase; owner names often are not.
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Pull requests build the image to prove it builds, but never publish it.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v4
        if: github.event_name != 'pull_request'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      # The chart is released with the image, at the same version, pinned to the
      # digest just pushed.
      - name: Release the chart
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i \
            -e "s#^  repository: .*#  repository: ${IMAGE}#" \
            -e "s#^  digest: .*#  digest: \"${DIGEST}\"#" \
            charts/nodedash/values.yaml
          helm package charts/nodedash --version "$version" --app-version "$version" --destination chart-dist
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "chart-dist/nodedash-${version}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
